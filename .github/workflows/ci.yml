name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify module files are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Format check
        run: |
          test -z "$(gofmt -l .)" || (echo "Run gofmt on files above" && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      # The race detector needs CGO and a C toolchain. That is why this runs
      # here and not (necessarily) on a contributor's machine: the Linux
      # runner already has gcc, whereas a stock Windows dev box has neither,
      # so `go test -race` fails there with `C compiler "gcc" not found`.
      # See docs/agent-operating-model.md's sibling note in
      # scripts/dev.ps1's "race" target for the local story.
      #
      # This project has repeatedly hunted concurrency bugs by hand
      # (parallel course crawls, worker pools, parallel downloads), so having
      # the standard tool for that class of bug run on every PR is worth the
      # extra minute.
      - name: Test (race detector)
        env:
          CGO_ENABLED: 1
        run: go test -race ./...

      - name: Build
        run: go build ./...
