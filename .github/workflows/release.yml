name: release

# Tag-triggered release build: produces opal-downloader-setup.exe (with a
# bundled Chromium matching the pinned playwright-go version, see
# installer/opal-downloader.iss) and publishes it as a GitHub Release asset.
#
# Tag format: vX.Y.Z (e.g. v0.2.0). This is not an arbitrary choice - it's
# the format docs/update-mechanism-plan.md's planned internal/updater
# package already assumes (Section 2.2: parses the release's `tag_name`,
# strips a leading "v", compares against buildVersion). Push a tag in any
# other shape and that comparison - and this workflow's own -ldflags
# version string - will be wrong.
#
# Asset naming: the compiled installer is uploaded UNVERSIONED as
# "opal-downloader-setup.exe" (not e.g. "opal-downloader-setup-v0.2.0.exe").
# This matches docs/update-mechanism-plan.md Section 2.2's existing example
# ("Picks the release asset matching the expected name pattern (e.g.
# opal-downloader-setup.exe)") - an unversioned name means the future
# updater can always look up the same fixed asset name on
# GET .../releases/latest without also having to parse the version back out
# of the filename. A ".sha256" sidecar (plain `Get-FileHash` output, one
# line) is uploaded alongside it; a separate queued task refines checksum
# publishing further - this is just enough to unblock a stable asset shape.
on:
  push:
    tags:
      - "v*"
  # Manual trigger, added 2026-08-03 so the installer can be *verified*
  # without cutting a release. The Chromium-cache-path bug this branch fixes
  # was unverifiable any other way: reproducing it needs Inno Setup plus a
  # populated Playwright cache, and the only environment that has both
  # already is this runner. A dispatch run builds and installs the installer
  # and asserts where Chromium landed, then stops - the release step below
  # is tag-only, so nothing is published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Inno Setup
        # Chocolatey ships preinstalled on GitHub-hosted Windows runners.
        # scripts/build-installer.ps1 already knows how to find ISCC.exe at
        # its default install locations (see its "Resolve iscc.exe" step),
        # including the one this installs to.
        run: choco install innosetup -y --no-progress
        shell: pwsh

      - name: Fetch Playwright Chromium
        # A fresh windows-latest runner has no local Playwright cache at
        # all, unlike a dev machine that may have already run
        # `opal-downloader.exe setup`. This shells out to the same
        # `playwright install` driver command runSetup uses (see
        # cmd/opal-downloader/root.go), using the exact playwright-go
        # version pinned in go.mod so the fetched Chromium revision matches
        # what the built opal-downloader.exe expects at runtime. Installing
        # the full driver (not just "chromium") is intentional: it's what
        # guarantees both "chromium-<rev>" AND "chromium_headless_shell-<rev>"
        # land in the cache - see installer/opal-downloader.iss's header
        # comment for why both are required (headless list/sync session
        # reuse resolves to chrome-headless-shell.exe, not chrome.exe).
        #
        # PLAYWRIGHT_BROWSERS_PATH is set explicitly here to match
        # EnsurePlaywrightBrowsersPath's default (internal/scraper/
        # session.go) - the same path the running app and
        # build-installer.ps1's ChromiumCacheSrc default expect. Without
        # this, the bare `playwright install` CLI falls back to its own
        # default (%LOCALAPPDATA%\ms-playwright), which is not where
        # anything else in this chain looks (found 2026-07-31, see
        # docs/installer-plan.md's addendum).
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $env:USERPROFILE ".opal-downloader\ms-playwright"
          go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6100.0 install
        shell: pwsh

      - name: Build installer
        id: build
        shell: pwsh
        run: |
          # On a tag push ref_name is the tag (v1.2.3). On workflow_dispatch
          # it is the branch name, which is not a version and would end up
          # in the installer's own version string - so dispatch runs build
          # under a fixed placeholder instead. Dispatch runs never publish
          # (see the tag-only condition on the release step).
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -ne "push") { $tag = "v0.0.0-ci" }
          ./scripts/build-installer.ps1 -Version $tag

          $exe = Join-Path $PWD "installer\output\opal-downloader-setup.exe"
          if (-not (Test-Path $exe)) {
            throw "Expected installer output not found at $exe"
          }

          # This sidecar guards against corrupted/truncated downloads and
          # naive tampering in transit - it does NOT guard against a
          # genuinely malicious release published by whoever controls this
          # repo's release pipeline (they could just as easily publish a
          # matching checksum for a malicious binary). That's a code-signing
          # problem, a different trust root, and out of scope here. See
          # docs/update-mechanism-plan.md Section 4 for the full writeup.
          $hash = Get-FileHash -Algorithm SHA256 $exe
          $sidecar = "$exe.sha256"
          "$($hash.Hash.ToLower())  opal-downloader-setup.exe" | Out-File -Encoding ascii -NoNewline $sidecar

          "exe_path=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sidecar_path=$sidecar" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Verify the installer puts Chromium where the app looks for it
        # This is the acceptance test for the bug this branch fixes: the
        # installer bundled Chromium into %LOCALAPPDATA%\ms-playwright while
        # EnsurePlaywrightBrowsersPath (internal/scraper/session.go) has read
        # %USERPROFILE%\.opal-downloader\ms-playwright since b352143, so a
        # fresh install silently shipped a Chromium the app never found.
        #
        # The "Fetch Playwright Chromium" step above already populated the
        # target path on this runner - so asserting against it directly would
        # pass no matter what the installer did. The cache is therefore moved
        # aside FIRST (after the build has consumed it, before the install),
        # which is what makes a green check here mean anything at all.
        shell: pwsh
        run: |
          $target = Join-Path $env:USERPROFILE ".opal-downloader\ms-playwright"
          $stash  = Join-Path $env:USERPROFILE ".opal-downloader\ms-playwright-prebuilt"
          if (Test-Path $target) { Move-Item $target $stash }
          if (Test-Path $target) { throw "could not clear $target before install" }

          $exe = "${{ steps.build.outputs.exe_path }}"
          $p = Start-Process -FilePath $exe `
            -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOICONS" `
            -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "silent install failed with exit code $($p.ExitCode)" }

          # Both are required, not just chromium-*: a headless list/sync
          # session resolves to chrome-headless-shell.exe, so an install
          # missing the shell breaks the non-GUI path only (see
          # installer/opal-downloader.iss's header comment).
          # Checked per browser: the directory exists, it actually contains
          # the executable, and that executable runs. A directory-only check
          # would go green on an empty chromium-1228\ folder, which is
          # exactly the shape a half-copied install leaves behind - and the
          # point of the bundle is a browser the app can start, not a
          # correctly named folder.
          foreach ($b in @(
            @{ Prefix = "chromium-";                Exe = "chrome.exe" },
            @{ Prefix = "chromium_headless_shell-"; Exe = "chrome-headless-shell.exe" }
          )) {
            $dir = Get-ChildItem -Path $target -Directory -Filter "$($b.Prefix)*" -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $dir) {
              Write-Host "--- contents of $target ---"
              Get-ChildItem -Path $target -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
              throw "installer did not place '$($b.Prefix)*' under $target - this is the bug this workflow is meant to catch"
            }

            $exe = Get-ChildItem -Path $dir.FullName -Recurse -Filter $b.Exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) {
              Write-Host "--- contents of $($dir.FullName) ---"
              Get-ChildItem -Path $dir.FullName -Recurse -Depth 1 -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host
              throw "$($dir.Name) exists but contains no $($b.Exe) - the bundle is incomplete, not merely misplaced"
            }

            # --version starts the real binary and exits; it needs no
            # display, no network and no OPAL account, so it is the cheapest
            # evidence that what shipped is a runnable browser rather than a
            # truncated copy.
            $v = & $exe.FullName --version 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "$($exe.Name) is present at $($exe.FullName) but failed to run (exit $LASTEXITCODE): $v"
            }
            Write-Host "OK: $($dir.Name) -> $($exe.Name) runs: $v"
          }

          # The old, wrong location must stay empty of *our* doing. It is
          # only checked when the build did not create it beforehand, since
          # a dev runner image could legitimately carry one.
          $wrong = Join-Path $env:LOCALAPPDATA "ms-playwright"
          if (Test-Path $wrong) {
            Write-Host "note: $wrong exists on this runner (not created by the install step)"
          }

      - name: Create GitHub Release and upload assets
        # Tag pushes only. A workflow_dispatch run exists to verify the
        # installer, not to publish one.
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            "${{ steps.build.outputs.exe_path }}" `
            "${{ steps.build.outputs.sidecar_path }}" `
            --title $tag `
            --generate-notes
