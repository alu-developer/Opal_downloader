# Local download destination (absolute or relative path)
download_path: "D:/Uni/OPAL"

# Optional default folder for courses without an explicit rule.
# If omitted, the course name is used as before.
default_course_folder: "default"

# Optional course-specific folder rules. Patterns use the same matching logic as
# the courses list below. The first matching rule wins.
course_folders:
  "*Programmierung*": "Informatik/Programmierung"
  "*Analysis*": "Mathematik/Analysis"

# Optional: organize each course's downloads into subfolders per OPAL section
# (e.g. "Übungen", "Vorlesung") instead of the flat "<course>/<file>" default.
# Default is false; leaving this unset/false keeps output identical to before.
use_section_subfolders: false

# Optional: rename/normalize specific OPAL section names to your own subfolder
# names, instead of using OPAL's raw section wording. Only applies when
# use_section_subfolders is true. Keys are section-name patterns (same matching
# rules as course_folders); unmatched sections keep OPAL's own sanitized name.
section_folder_names:
  "Exercises": "Übungen"

# Optional: redirect one course's specific section to an arbitrary destination
# path (can be outside download_path entirely), bypassing the normal course
# folder for just that subfolder. Keys are "<course pattern>/<subfolder pattern>",
# each matched with the same pattern rules as course_folders. Only applies when
# use_section_subfolders is true.
subfolder_destinations:
  "*Analysis*/*Vorlesung*": "D:/Elsewhere/AnalysisSlides"

# Exact course names to sync (case-insensitive). Partial/glob patterns are NOT
# matched here - unlike course_folders above, this list requires the full course
# name as it appears in OPAL.
# Use "*" to include every course found during login.
# Examples:
#   - "*"                          (all courses)
#   - "Analysis 1"                 (exact course name)
courses:
  - "*"

# On re-run, skip unchanged files (uses size/modified metadata)
sync: true

# (Optional) Maximum number of files downloaded concurrently during sync via
# the fast HTTP path. Keep this conservative - a large value increases the
# chance of tripping OPAL's rate-limiting/bot-detection. Can also be set with
# --concurrency on the sync command. Defaults to 3.
download_concurrency: 3

# (Optional) Maximum number of courses crawled concurrently during discovery,
# each on its own browser tab. Keep this conservative for the same reason as
# download_concurrency. Can also be set with --course-concurrency on the
# list/sync commands. Defaults to 3.
course_concurrency: 3

# (Optional) OPAL instance URL. Defaults to TU Dresden OPAL.
# Only change if you're using a different Bildungsportal Sachsen instance.
opal_url: "https://bildungsportal.sachsen.de/opal/"

# (Optional) where Playwright stores authenticated session state.
# Default in code: ~/.opal_storage_state.json
session_state_file: "~/.opal_storage_state.json"

# Optional: use your installed browser + profile so existing extensions (e.g. TU-Fast) are available.
# Leave empty to use Playwright's bundled browser.
# Example Brave executable on Windows:
# browser_executable: "C:/Program Files/BraveSoftware/Brave-Browser/Application/brave.exe"
# Example Brave executable on Linux:
# browser_executable: "/usr/bin/brave-browser"
# Example Brave executable on macOS:
# browser_executable: "/Applications/Brave Browser.app/Contents/MacOS/Brave Browser"
browser_executable: ""

# Optional: browser user-data directory (profile root). Needed if TU-Fast/2FA should be
# available automatically instead of logging in manually every time. opal-downloader
# launches Playwright directly against this directory - there is no working copy (a
# copy-based approach was tried and doesn't work: Chromium's "Secure Preferences" file is
# integrity-protected (HMAC) in a way that detects a copied user-data-dir and strips
# extension permissions, including TU-Fast's, as soon as Chromium loads the copy).
#
# Two supported ways to fill this in - pick one:
#
#   - Recommended: point this at a dedicated profile such as
#     "~/.opal-downloader/login-profile" that you set up once, following
#     docs/browser-profile-strategy.md. Your everyday browser is never locked or closed by
#     opal-downloader, because it's not the profile opal-downloader uses.
#   - Alternative: point this at your real Brave/Chrome profile directly, if you already
#     have TU-Fast working there. Example Brave user-data directories:
#       Windows: "C:/Users/<YOU>/AppData/Local/BraveSoftware/Brave-Browser/User Data"
#       Linux:   "~/.config/BraveSoftware/Brave-Browser"
#       macOS:   "~/Library/Application Support/BraveSoftware/Brave-Browser"
#     With this option, `login` and any session-expiry fallback require your browser to be
#     fully closed first - if this directory is still open in another instance,
#     opal-downloader fails with a clear "please fully close Brave first" error instead of
#     crashing. There's nothing to re-copy after installing/updating TU-Fast either way -
#     opal-downloader always reads this directory directly, so it always sees your latest
#     extension/login state.
#
# Leave empty (default) to use Playwright's bundled browser with no extensions - works out
# of the box, but every login needs manual 2FA.
browser_user_data_dir: ""

# Optional: profile directory inside browser_user_data_dir (e.g. "Default", "Profile 1").
# Set this if TU-Fast is installed in a non-default browser profile.
browser_profile_directory: ""
