# Local download destination (absolute or relative path)
download_path: "D:/Uni/OPAL"

# Course folder name patterns (fnmatch, case-insensitive).
# Use "*" to include every course/group folder.
courses:
  - "*"

# WebDAV roots to scan. Common OPAL folders:
#   coursefolders  — course storage and folder elements
#   groupfolders   — learning/working group folders
#   home           — your personal OPAL folder
roots:
  - coursefolders
  - groupfolders
  - home

# On re-run, skip unchanged files (uses etag/size/modified metadata)
sync: true

# Remove local files that disappeared on OPAL (default: false)
delete_removed: false
