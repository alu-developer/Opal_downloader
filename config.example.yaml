# Local download destination (absolute or relative path). "./downloads"
# (relative to wherever you run opal-downloader from) works out of the box -
# change it to wherever you actually want your files.
download_path: "./downloads"

# Optional default folder for courses without an explicit rule.
# If omitted, the course name is used as before.
default_course_folder: "default"

# Optional course-specific folder rules. Patterns use the same matching logic as
# the courses list below. The first matching rule wins.
course_folders:
  "*Programmierung*": "Informatik/Programmierung"
  "*Analysis*": "Mathematik/Analysis"

# Optional: organize each course's downloads into subfolders per OPAL section
# (e.g. "Übungen", "Vorlesung") instead of the flat "<course>/<file>" default.
# Default is false; leaving this unset/false keeps output identical to before.
use_section_subfolders: false

# Optional: rename/normalize specific OPAL section names to your own subfolder
# names, instead of using OPAL's raw section wording. Only applies when
# use_section_subfolders is true. Keys are section-name patterns (same matching
# rules as course_folders); unmatched sections keep OPAL's own sanitized name.
# Left commented out: an active entry here while use_section_subfolders is
# false above just produces a "has no effect" warning on every run.
# section_folder_names:
#   "Exercises": "Übungen"

# Optional: redirect one course's specific section to an arbitrary destination
# path (can be outside download_path entirely), bypassing the normal course
# folder for just that subfolder. Keys are "<course pattern>/<subfolder pattern>",
# each matched with the same pattern rules as course_folders. Only applies when
# use_section_subfolders is true. Commented out for the same reason as
# section_folder_names above.
# subfolder_destinations:
#   "*Analysis*/*Vorlesung*": "D:/Elsewhere/AnalysisSlides"

# Exact course names to sync (case-insensitive). Partial/glob patterns are NOT
# matched here - unlike course_folders above, this list requires the full course
# name as it appears in OPAL.
# Use "*" to include every course found during login.
# Examples:
#   - "*"                          (all courses)
#   - "Analysis 1"                 (exact course name)
courses:
  - "*"

# On re-run, skip unchanged files (uses size/modified metadata)
sync: true

# (Optional) Maximum number of files downloaded concurrently during sync via
# the fast HTTP path. Also settable with --concurrency on the sync command.
# Safe default is 3; see DefaultDownloadConcurrency in
# internal/config/config.go for the tuning history.
download_concurrency: 3

# (Optional) Maximum number of courses crawled concurrently during discovery,
# each on its own browser tab. Also settable with --course-concurrency on the
# list/sync commands. Safe default is 2, verified byte-for-byte against the
# full-account ground truth; raising it past 2 is not verified and has lost
# files before. See DefaultCourseConcurrency in internal/config/config.go for
# the full root-cause and measurement history.
course_concurrency: 2

# (Optional) OPAL instance URL. Defaults to TU Dresden OPAL.
# Only change if you're using a different Bildungsportal Sachsen instance.
opal_url: "https://bildungsportal.sachsen.de/opal/"

# (Optional) where Playwright stores authenticated session state.
# Default in code: ~/.opal_storage_state.json
session_state_file: "~/.opal_storage_state.json"

# There is no browser_executable/browser_user_data_dir/browser_profile_directory
# to configure anymore: opal-downloader always logs in and syncs using
# Playwright's bundled Chromium against a single dedicated profile at
# ~/.opal-downloader/login-profile - never your everyday browser. Log in
# manually there, or, once, install TU-Fast from the Chrome Web Store into
# that same profile for automatic 2FA on every future login - see the GUI's
# Settings -> "Set up TU-Fast" (/tufast-setup) page, or
# docs/browser-profile-strategy.md.
