# Local download destination (absolute or relative path)
download_path: "D:/Uni/OPAL"

# Optional default folder for courses without an explicit rule.
# If omitted, the course name is used as before.
default_course_folder: "default"

# Optional course-specific folder rules. Patterns use the same matching logic as
# the courses list below. The first matching rule wins.
course_folders:
  "*Programmierung*": "Informatik/Programmierung"
  "*Analysis*": "Mathematik/Analysis"

# Course folder name patterns (fnmatch, case-insensitive).
# Use "*" to include every course/group folder found during login.
# Examples:
#   - "*"                    (all courses)
#   - "*Analysis*"          (courses containing "Analysis")
#   - "*SS2026*"            (semester filter)
courses:
  - "*"

# On re-run, skip unchanged files (uses size/modified metadata)
sync: true
