# Copy this file to secrets.yaml and fill in your credentials.
# secrets.yaml is gitignored — never commit it.

webdav:
  url: "https://bildungsportal.sachsen.de/opal/webdav"
  # OPAL username from: Administration → User profile → WebDAV access
  # Often looks like: zxxxxxx@tu-dresden.de
  username: "your-opal-username@tu-dresden.de"
  # Separate WebDAV password (NOT your ZIH/SSO password).
  # Set it in OPAL: Administration → User profile → WebDAV access
  password: "your-webdav-password"
